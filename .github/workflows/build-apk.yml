name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time; a newer push replaces one that is still running.
concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and test
        run: |
          npm ci
          npm test

      - name: Build the web app and generate the Android project
        run: |
          npm run build
          npx cap add android
          node scripts/android-icons.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk todo-app.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest todo-app.apk \
            --title "To-Do List App (Android APK)" \
            --notes "**Android:** download todo-app.apk on your phone and install it (allow installs from your browser or files app if asked). Built from commit ${GITHUB_SHA::7}.

          **iPhone / iPad:** there is no downloadable file for iOS, but the app installs from Safari. Open https://shoaibul0926.github.io/todo-app/ , tap Share, then Add to Home Screen. It opens full screen and works offline." \
            --latest
